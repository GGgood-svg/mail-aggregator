<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运维</title><link rel="stylesheet" href="/css/style.css"></head>
<body><div class="layout"><div class="sidebar"><div class="brand">📬 <span id="sidebar-brand-text">Mail Aggregator</span></div><nav id="sidebar-nav"></nav></div>
<main class="content"><h1>运维</h1>
  <section class="panel"><h2>服务状态</h2><div id="ops-health" aria-live="polite"></div><div id="ops-queue"></div></section>
  <section class="panel" style="margin-top:18px"><h2>存储趋势</h2>
    <p class="hint">曲线显示各时段的最低可用容量。缺少读数时，曲线留空。</p>
    <label for="ops-period">统计范围</label><select id="ops-period"><option value="24h">最近 24 小时</option><option value="7d">最近 7 天</option></select>
    <button class="btn secondary" type="button" id="ops-refresh">刷新</button>
    <p class="hint" id="ops-capacity-status" role="status"></p><div id="ops-capacity"></div>
  </section>
  <section class="panel" id="ops-audit-panel" style="margin-top:18px" hidden><h2>管理审计</h2>
    <p class="hint">记录网页请求以及已确认的配置恢复和应用更新结果。可用同步任务、恢复或更新编号关联记录。最多保留最近 30 天的 10,000 条记录。</p>
    <form id="ops-audit-filter">
      <div class="grid-2"><div class="form-group"><label for="ops-event">事件类型</label><select id="ops-event" name="event"></select></div>
      <div class="form-group"><label for="ops-outcome">处理结果</label><select id="ops-outcome" name="outcome"></select></div>
      <div class="form-group"><label for="ops-actor">操作人编号</label><input id="ops-actor" name="actor" type="number" min="1" step="1"></div>
      <div class="form-group"><label for="ops-subject">对象编号</label><input id="ops-subject" name="subject" type="number" min="1" step="1"></div>
      <div class="form-group"><label for="ops-operation-id">任务或操作编号</label><input id="ops-operation-id" name="operationId" type="text" maxlength="36" autocomplete="off" spellcheck="false"></div>
      <div class="form-group"><label for="ops-from">起始时间</label><input id="ops-from" name="from" type="datetime-local"></div>
      <div class="form-group"><label for="ops-to">结束时间</label><input id="ops-to" name="to" type="datetime-local"></div></div>
      <button class="btn secondary" type="submit">筛选</button>
      <button class="btn secondary" type="button" id="ops-audit-export" disabled>导出已加载记录</button>
    </form>
    <p id="ops-audit-status" class="hint" role="status"></p>
    <div style="overflow-x:auto"><table><thead><tr><th>时间</th><th>事件类型</th><th>处理结果</th><th>操作人编号</th><th>对象编号</th><th>任务或操作编号</th><th>审计编号</th></tr></thead><tbody id="ops-audit-rows"></tbody></table></div>
    <button class="btn secondary" type="button" id="ops-audit-more" hidden>加载更多</button>
  </section>
</main></div><script src="/js/api.js"></script><script src="/js/branding.js"></script><script src="/js/i18n.js"></script><script src="/js/operations.js"></script></body></html>
