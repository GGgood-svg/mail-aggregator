<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>查看邮件 - Mail Aggregator</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="layout">
  <div class="sidebar">
    <div class="brand">📬 <span id="sidebar-brand-text">Mail Aggregator</span></div>
    <nav id="sidebar-nav"></nav>
    <div class="footer-bar" id="footer-text"></div>
  </div>
  <main class="main mail-main">
    <div class="topbar">
      <div>
        <h1>查看邮件</h1>
        <div class="hint mail-intro">主动打开邮件会标为本地已读；账号数字表示收件箱未读数。</div>
      </div>
      <button class="btn secondary" id="refresh-mail">刷新邮件</button>
    </div>

    <div class="mail-layout">
      <section class="mail-folders" aria-label="邮箱文件夹">
        <div class="mail-pane-title">邮箱文件夹</div>
        <div id="folder-list" class="folder-list"><div class="mail-loading">正在加载…</div></div>
      </section>

      <section class="mail-list-pane" aria-label="邮件列表">
        <div class="mail-list-header">
          <div>
            <div class="mail-pane-title" id="current-folder" data-i18n-skip>INBOX</div>
            <div class="hint" id="message-total"></div>
            <button class="btn secondary small" id="folder-seen-all" type="button">文件夹全部已读</button>
          </div>
          <div class="mail-pager">
            <button class="btn secondary small" id="previous-page">上一页</button>
            <span id="page-label" class="hint"></span>
            <button class="btn secondary small" id="next-page">下一页</button>
          </div>
        </div>
        <div id="message-list" class="message-list"><div class="mail-loading">请选择文件夹</div></div>
      </section>

      <section class="mail-reader" aria-label="邮件正文">
        <div id="reader-empty" class="mail-reader-empty">选择一封邮件查看正文</div>
        <article id="reader-content" style="display:none">
          <header class="mail-message-header">
            <h2 id="reader-subject" data-i18n-skip></h2>
            <button class="btn secondary small" id="toggle-seen" type="button" data-i18n-skip></button>
            <dl class="mail-meta">
              <div><dt>发件人</dt><dd id="reader-from" data-i18n-skip></dd></div>
              <div><dt>收件人</dt><dd id="reader-to" data-i18n-skip></dd></div>
              <div id="reader-cc-row"><dt>抄送</dt><dd id="reader-cc" data-i18n-skip></dd></div>
              <div><dt>时间</dt><dd id="reader-date" data-i18n-skip></dd></div>
            </dl>
          </header>
          <div id="reader-attachments" class="mail-attachments" style="display:none"></div>
          <div id="reader-image-controls" class="mail-image-controls" style="display:none">
            <button class="btn secondary small" id="load-remote-images" type="button">加载远程图片</button>
            <span id="remote-image-warning">远程图片可能让发件人知道你打开了邮件，并看到你的网络地址。</span>
          </div>
          <div id="reader-body" class="mail-body" data-i18n-skip></div>
          <div class="mail-safety-note" id="mail-safety-note">内嵌图片和安全排版已还原；脚本、表单、外部样式和危险布局始终被屏蔽。</div>
        </article>
      </section>
    </div>
  </main>
</div>
<script src="/js/api.js"></script>
<script src="/js/branding.js"></script>
<script src="/js/i18n.js"></script>
<script>
const mailState = {
  folder: 'INBOX', page: 1, pageSize: 30, totalPages: 1,
  selectedUid: null, requestId: 0, collapsedGroups: new Set(), groupsInitialized: false,
};

function t(source) {
  return window.I18n ? window.I18n.t(source) : source;
}

function readableBytes(value) {
  const bytes = Number(value || 0);
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
  return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
}

function clearReader(message = '选择一封邮件查看正文') {
  document.getElementById('reader-empty').textContent = t(message);
  document.getElementById('reader-empty').style.display = 'flex';
  document.getElementById('reader-content').style.display = 'none';
}

function folderBelongsTo(folder, root) {
  const delimiter = folder.delimiter || '/';
  return folder.path === root || folder.path.startsWith(`${root}${delimiter}`);
}

function legacyRootCandidates(account) {
  const values = [account.destination_folder, account.name, String(account.username || '').split('@')[0]];
  const candidates = new Set();
  values.forEach((value) => {
    const normalized = String(value || '').trim();
    if (!normalized) return;
    candidates.add(normalized);
    // Older installs sometimes used the leading ASCII part (QQ, dayuan, etc.)
    // before the destination folder name was later made more descriptive.
    const asciiPrefix = normalized.match(/^[a-z0-9][a-z0-9._-]*/i)?.[0];
    if (asciiPrefix && asciiPrefix.length >= 2) candidates.add(asciiPrefix);
  });
  return [...candidates];
}

function groupFolders(folders, accounts) {
  const accountGroups = accounts
    .filter((account) => account.destination_mode === 'subfolder' && account.destination_folder)
    .map((account) => ({
      key: `account-${account.id}`,
      label: account.name,
      detail: '',
      configuredRoot: account.destination_folder,
      root: '',
      folders: [],
    }));
  const localGroup = { key: 'local', label: t('本地邮箱'), detail: '', root: '', folders: [] };

  // Prefer the configured destination, but recognize folder names left behind by
  // older releases (for example "QQ" vs "QQ邮箱", or "dayuan" vs "dayuan谷歌").
  for (const group of accountGroups) {
    const account = accounts.find((item) => `account-${item.id}` === group.key);
    group.root = legacyRootCandidates(account)
      .filter((candidate) => folders.some((folder) => folderBelongsTo(folder, candidate)))
      .sort((a, b) => b.length - a.length)[0] || '';
    group.detail = group.root || group.configuredRoot;
  }

  for (const folder of folders) {
    const group = accountGroups
      .filter((candidate) => candidate.root && folderBelongsTo(folder, candidate.root))
      .sort((a, b) => b.root.length - a.root.length)[0];
    (group || localGroup).folders.push(folder);
  }

  // If exactly one configured account has no surviving root directory, the
  // remaining top-level folders are its legacy flat mailbox. Keeping them under
  // that account is clearer than mixing them into a generic local bucket.
  const rootlessGroups = accountGroups.filter((group) => !group.root);
  if (rootlessGroups.length === 1 && localGroup.folders.length) {
    const legacyGroup = rootlessGroups[0];
    legacyGroup.folders.push(...localGroup.folders);
    localGroup.folders = [];
    legacyGroup.detail = t('旧版未隔离目录');
  }

  for (const group of accountGroups) {
    const hasChildren = group.folders.some((folder) => folder.path !== group.root);
    if (hasChildren) {
      group.folders = group.folders.filter((folder) => folder.path !== group.root || folder.messages > 0);
    }
  }
  return [...accountGroups, localGroup].filter((group) => group.folders.length);
}

function relativeFolderName(folder, group) {
  if (!group.root) return folder.name || folder.path;
  if (folder.path === group.root) return t('全部邮件');
  const delimiter = folder.delimiter || '/';
  return folder.path.slice(group.root.length + delimiter.length).split(delimiter).pop();
}

function folderDepth(folder, group) {
  if (!group.root || folder.path === group.root) return 0;
  const delimiter = folder.delimiter || '/';
  return Math.max(0, folder.path.slice(group.root.length + delimiter.length).split(delimiter).length - 1);
}

function folderIcon(folder) {
  const marker = `${folder.specialUse || ''} ${folder.name || ''}`.toLowerCase();
  if (marker.includes('inbox')) return '▣';
  if (marker.includes('sent') || marker.includes('已发送')) return '↗';
  if (marker.includes('draft') || marker.includes('草稿')) return '✎';
  if (marker.includes('trash') || marker.includes('deleted') || marker.includes('已删除')) return '⌫';
  if (marker.includes('junk') || marker.includes('spam') || marker.includes('垃圾')) return '⊘';
  if (marker.includes('archive') || marker.includes('归档')) return '▤';
  if (marker.includes('important') || marker.includes('重要')) return '★';
  return '◇';
}

function renderFolder(folder, group) {
  const unread = folder.unseen
    ? `<strong class="folder-unread">${folder.unseen}</strong>`
    : '';
  const total = folder.messages ? `<span class="folder-total">${folder.messages}</span>` : '';
  const countLabel = folder.unseen
    ? `${folder.unseen} ${t('封未读邮件')}，${t('共')} ${folder.messages} ${t('封邮件')}`
    : `${t('共')} ${folder.messages} ${t('封邮件')}`;
  return `
    <button class="folder-item ${folder.path === mailState.folder ? 'active' : ''}"
      data-folder="${escapeHtml(folder.path)}" style="--folder-depth:${folderDepth(folder, group)}"
      title="${escapeHtml(`${relativeFolderName(folder, group)} · ${countLabel}`)}">
      <span class="folder-item-main"><span class="folder-icon" aria-hidden="true">${folderIcon(folder)}</span><span class="folder-name" data-i18n-skip>${escapeHtml(relativeFolderName(folder, group))}</span></span>
      <span class="folder-count">${unread}${total}</span>
    </button>`;
}

function selectFolder(path) {
  if (path === mailState.folder) return;
  mailState.folder = path;
  mailState.page = 1;
  mailState.selectedUid = null;
  document.querySelectorAll('.folder-item').forEach((item) => item.classList.toggle('active', item.dataset.folder === path));
  clearReader();
  loadMessages().catch(showError);
}

async function loadFolders() {
  const list = document.getElementById('folder-list');
  list.innerHTML = `<div class="mail-loading">${escapeHtml(t('正在加载…'))}</div>`;
  const [data, accounts] = await Promise.all([
    Api.get('/api/mail/folders'),
    Api.get('/api/accounts'),
  ]);
  if (!data.folders.length) {
    list.innerHTML = `<div class="mail-loading">${escapeHtml(t('没有可查看的文件夹'))}</div>`;
    return false;
  }
  if (!data.folders.some((item) => item.path === mailState.folder)) {
    mailState.folder = data.folders[0].path;
  }
  const groups = groupFolders(data.folders, accounts);
  groups.sort((a, b) => {
    const aActive = a.folders.some((folder) => folder.path === mailState.folder);
    const bActive = b.folders.some((folder) => folder.path === mailState.folder);
    return Number(bActive) - Number(aActive);
  });
  if (!mailState.groupsInitialized) {
    groups.forEach((group) => {
      if (!group.folders.some((folder) => folder.path === mailState.folder)) {
        mailState.collapsedGroups.add(group.key);
      }
    });
    mailState.groupsInitialized = true;
  }
  list.innerHTML = groups.map((group) => {
    const collapsed = mailState.collapsedGroups.has(group.key);
    const unread = group.folders.filter((folder) => (folder.name || '').toUpperCase() === 'INBOX').reduce((sum, folder) => sum + folder.unseen, 0);
    return `<div class="folder-group ${collapsed ? 'collapsed' : ''}" data-group="${escapeHtml(group.key)}">
      <button class="folder-group-header" type="button" aria-expanded="${!collapsed}">
        <span class="folder-chevron" aria-hidden="true">⌄</span>
        <span class="folder-group-label"><strong data-i18n-skip>${escapeHtml(group.label)}</strong>${group.detail ? `<small data-i18n-skip>${escapeHtml(group.detail)}</small>` : ''}</span>
        ${unread ? `<span class="folder-group-unread">${unread}</span>` : ''}
      </button>
      <button class="btn secondary small group-seen-all" type="button" data-group-key="${escapeHtml(group.key)}">${escapeHtml(t('此分组全部已读'))}</button>
      <div class="folder-group-items">${group.folders.map((folder) => renderFolder(folder, group)).join('')}</div>
    </div>`;
  }).join('');
  list.querySelectorAll('.folder-group-header').forEach((button) => button.addEventListener('click', () => {
    const group = button.closest('.folder-group');
    const collapsed = group.classList.toggle('collapsed');
    button.setAttribute('aria-expanded', String(!collapsed));
    if (collapsed) mailState.collapsedGroups.add(group.dataset.group);
    else mailState.collapsedGroups.delete(group.dataset.group);
  }));
  list.querySelectorAll('.folder-item').forEach((button) => button.addEventListener('click', () => selectFolder(button.dataset.folder)));
  list.querySelectorAll('.group-seen-all').forEach((button) => {
    button.disabled = !!mailState.bulkBusy;
    button.addEventListener('click', () => {
      const group = groups.find((item) => item.key === button.dataset.groupKey);
      markAllSeen(group.label, group.folders.map((folder) => folder.path));
    });
  });
  return true;
}

async function loadMessages() {
  const requestId = ++mailState.requestId;
  const list = document.getElementById('message-list');
  list.innerHTML = `<div class="mail-loading">${escapeHtml(t('正在加载…'))}</div>`;
  const query = new URLSearchParams({ folder: mailState.folder, page: mailState.page, pageSize: mailState.pageSize });
  const data = await Api.get(`/api/mail/messages?${query}`);
  if (requestId !== mailState.requestId) return;
  const selected = data.messages.find((message) => message.uid === mailState.selectedUid);
  if (selected) { mailState.seen = selected.seen; updateSeenButton(); }
  mailState.totalPages = data.totalPages;
  document.getElementById('current-folder').textContent = data.folder;
  document.getElementById('message-total').textContent = `${t('共')} ${data.total} ${t('封邮件')}`;
  document.getElementById('page-label').textContent = `${data.page} / ${data.totalPages}`;
  document.getElementById('previous-page').disabled = data.page <= 1;
  document.getElementById('next-page').disabled = data.page >= data.totalPages;
  if (!data.messages.length) {
    list.innerHTML = `<div class="mail-loading">${escapeHtml(t('这个文件夹还没有邮件'))}</div>`;
    return;
  }
  list.innerHTML = data.messages.map((message) => `
    <button class="message-item ${message.seen ? '' : 'unread'} ${message.uid === mailState.selectedUid ? 'active' : ''}" data-uid="${message.uid}">
      <span class="message-unread-dot" aria-hidden="true"></span>
      <span class="message-content">
        <span class="message-row"><span class="message-from" data-i18n-skip>${escapeHtml(message.from || t('未知发件人'))}</span><time>${escapeHtml(fmtTime(message.date))}</time></span>
        <span class="message-subject" data-i18n-skip>${escapeHtml(message.subject)}</span>
        <span class="message-size">${message.flagged ? '★ · ' : ''}${readableBytes(message.size)}</span>
      </span>
    </button>`).join('');
  list.querySelectorAll('.message-item').forEach((button) => button.addEventListener('click', () => {
    mailState.selectedUid = Number(button.dataset.uid);
    list.querySelectorAll('.message-item').forEach((item) => item.classList.toggle('active', item === button));
    loadMessage(mailState.selectedUid, true).catch(showError);
  }));
  if (!mailState.selectedUid && data.messages.length && window.matchMedia('(min-width: 761px)').matches) {
    const first = list.querySelector('.message-item');
    mailState.selectedUid = Number(first.dataset.uid);
    first.classList.add('active');
    loadMessage(mailState.selectedUid).catch(showError);
  }
}

async function loadMessage(uid, markRead = false) {
  clearReader('正在加载邮件正文…');
  const folderAtRequest = mailState.folder;
  const query = new URLSearchParams({ folder: folderAtRequest });
  const data = await Api.get(`/api/mail/messages/${uid}?${query}`);
  if (mailState.folder !== folderAtRequest || mailState.selectedUid !== uid) return;
  const message = data.message;
  mailState.seen = message.seen;
  updateSeenButton();
  document.getElementById('reader-subject').textContent = message.subject;
  document.getElementById('reader-from').textContent = message.from || '-';
  document.getElementById('reader-to').textContent = message.to || '-';
  document.getElementById('reader-cc').textContent = message.cc || '-';
  document.getElementById('reader-cc-row').style.display = message.cc ? 'grid' : 'none';
  document.getElementById('reader-date').textContent = message.date
    ? new Date(message.date).toLocaleString((window.I18n && window.I18n.locale) || 'zh-CN')
    : '-';

  const attachments = document.getElementById('reader-attachments');
  if (message.attachments.length) {
    attachments.style.display = 'block';
    attachments.innerHTML = `<strong>${escapeHtml(t('附件'))} (${message.attachments.length})</strong>` + message.attachments.map((item) =>
      `<span data-i18n-skip>📎 ${escapeHtml(item.filename)} · ${readableBytes(item.size)}</span>`
    ).join('');
  } else {
    attachments.style.display = 'none';
    attachments.innerHTML = '';
  }

  const body = document.getElementById('reader-body');
  if (message.html) body.innerHTML = message.html;
  else {
    const pre = document.createElement('pre');
    pre.textContent = message.text || t('这封邮件没有可显示的正文');
    body.replaceChildren(pre);
  }
  const imageControls = document.getElementById('reader-image-controls');
  const remoteImageCount = Number(message.remoteImageCount || 0);
  imageControls.style.display = remoteImageCount ? 'flex' : 'none';
  document.getElementById('load-remote-images').textContent = remoteImageCount
    ? `${t('加载远程图片')} (${remoteImageCount})`
    : t('加载远程图片');
  document.getElementById('mail-safety-note').textContent = remoteImageCount
    ? t('内嵌图片和安全排版已还原；远程图片仍被拦截，脚本和危险布局已移除。')
    : t('内嵌图片和安全排版已还原；脚本、表单、外部样式和危险布局始终被屏蔽。');
  document.getElementById('reader-empty').style.display = 'none';
  document.getElementById('reader-content').style.display = 'block';
  if (markRead && !message.seen) await setSeen(true, uid, folderAtRequest);
  if (window.matchMedia('(max-width: 760px)').matches) {
    document.querySelector('.mail-reader').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function updateSeenButton() {
  document.getElementById('toggle-seen').textContent = t(mailState.seen ? '标为未读' : '标为已读');
}

async function markAllSeen(label, folders) {
  if (mailState.bulkBusy) return;
  if (!confirm(`${t('将以下范围全部标为本地已读（包含所有分页）？')}\n${label}\n\n${folders.join('\n')}`)) return;
  mailState.bulkBusy = true;
  document.querySelectorAll('#folder-seen-all, .group-seen-all').forEach((button) => { button.disabled = true; });
  try {
    const data = await Api.put('/api/mail/seen-all', { folders });
    const failed = data.results.filter((result) => !result.ok);
    if (failed.length) toast(`${t('部分文件夹失败，请刷新后重试')}：${failed.map((result) => result.folder).join(', ')}`, 'error');
    else toast(t('已全部标为已读'));
  } catch (error) { showError(error); }
  finally {
    mailState.bulkBusy = false;
    await refreshAll();
    document.querySelectorAll('#folder-seen-all, .group-seen-all').forEach((button) => { button.disabled = false; });
  }
}

async function setSeen(seen, uid = mailState.selectedUid, folder = mailState.folder) {
  const button = document.getElementById('toggle-seen');
  button.disabled = true;
  try {
    const result = await Api.put(`/api/mail/messages/${uid}/seen?${new URLSearchParams({ folder })}`, { seen });
    if (mailState.folder === folder) {
      document.querySelectorAll('.message-item').forEach((item) => {
        if (Number(item.dataset.uid) === uid) item.classList.toggle('unread', !result.seen);
      });
      if (mailState.selectedUid === uid) { mailState.seen = result.seen; updateSeenButton(); }
    }
    await loadFolders();
  } finally { button.disabled = false; }
}

function loadRemoteImages() {
  const body = document.getElementById('reader-body');
  let loaded = 0;
  body.querySelectorAll('img[data-remote-src]').forEach((image) => {
    try {
      const url = new URL(image.dataset.remoteSrc);
      if (!['http:', 'https:'].includes(url.protocol)) return;
      image.src = url.href;
      image.removeAttribute('data-remote-src');
      loaded += 1;
    } catch (_) {}
  });
  document.getElementById('reader-image-controls').style.display = 'none';
  if (loaded) document.getElementById('mail-safety-note').textContent = t('远程图片已由你主动加载；脚本、表单、外部样式和危险布局仍然被屏蔽。');
}

function showError(error) {
  toast(error.message, 'error');
}

async function refreshAll() {
  try {
    const hasFolders = await loadFolders();
    if (hasFolders) await loadMessages();
  } catch (error) { showError(error); }
}

document.getElementById('refresh-mail').addEventListener('click', refreshAll);
document.getElementById('folder-seen-all').addEventListener('click', () => markAllSeen(mailState.folder, [mailState.folder]));
document.getElementById('toggle-seen').addEventListener('click', () => setSeen(!mailState.seen).catch(showError));
document.getElementById('load-remote-images').addEventListener('click', loadRemoteImages);
document.getElementById('previous-page').addEventListener('click', () => {
  if (mailState.page > 1) { mailState.page -= 1; mailState.selectedUid = null; clearReader(); loadMessages().catch(showError); }
});
document.getElementById('next-page').addEventListener('click', () => {
  if (mailState.page < mailState.totalPages) { mailState.page += 1; mailState.selectedUid = null; clearReader(); loadMessages().catch(showError); }
});

(async function initializeMail() {
  applyBranding();
  await requireLogin();
  renderNav('mail');
  await refreshAll();
})();
</script>
</body>
</html>
