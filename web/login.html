<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="center-box">
  <div class="panel">
    <h1 id="form-title" style="margin-bottom:4px;"><span id="login-title-text">登录</span></h1>
    <div id="app-subtitle-text" style="color:var(--text-dim); font-size:13px; margin-bottom:18px;"></div>
    <div id="http-warning" class="hint" style="display:none;background:rgba(245,166,35,.1);border:1px solid var(--warn);border-radius:8px;padding:10px;margin-bottom:14px;color:var(--warn);">
      当前通过 HTTP 连接。密码会交给服务器校验，但传输过程无法抵御窃听或网页劫持；外网访问请先配置 HTTPS。
    </div>
    <div id="password-step">
    <div class="form-group">
      <label for="username">用户名</label>
      <input type="text" id="username" autocomplete="username">
    </div>
    <div class="form-group">
      <label for="password">密码</label>
      <input type="password" id="password" autocomplete="current-password">
    </div>
    <div class="form-group" id="password-hint" style="display:none;">
      <div class="hint">首次使用,请创建管理员账号(密码至少10位)</div>
    </div>
    </div>
    <section id="login-totp-step" hidden data-i18n-skip>
      <p class="hint" data-totp="loginHint"></p>
      <div class="form-group"><label for="login-totp-code" data-totp="loginCode"></label>
        <input id="login-totp-code" type="text" maxlength="40" autocomplete="one-time-code" autocapitalize="none" spellcheck="false">
      </div>
      <p><button type="button" class="btn secondary" id="login-totp-back" data-totp="back"></button></p>
    </section>
    <button class="btn" id="submit-btn" style="width:100%;">登录</button>
    <div id="error-msg" role="alert" style="color:var(--err);font-size:13px;margin-top:10px;"></div>
  </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/branding.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/totp-i18n.js"></script>
<script>
let isSetupMode = false;
let waitingForTotp = false;
const submit = document.getElementById('submit-btn');
const totpCode = document.getElementById('login-totp-code');
const error = document.getElementById('error-msg');
function totpStep(active, authenticatorOnly = false) {
  waitingForTotp = active;
  document.getElementById('password-step').hidden = active;
  document.getElementById('login-totp-step').hidden = !active;
  document.getElementById('login-totp-back').disabled = false;
  document.getElementById('password').value = '';
  totpCode.value = '';
  totpCode.maxLength = authenticatorOnly ? 6 : 40;
  totpCode.inputMode = authenticatorOnly ? 'numeric' : 'text';
  const hint = document.querySelector('#login-totp-step p.hint');
  const caption = document.querySelector('label[for="login-totp-code"]');
  hint.dataset.totp = authenticatorOnly ? 'lanLoginHint' : 'loginHint';
  caption.dataset.totp = authenticatorOnly ? 'authenticatorCode' : 'loginCode';
  hint.textContent = TotpText.t(hint.dataset.totp);
  caption.textContent = TotpText.t(caption.dataset.totp);
  submit.textContent = active ? TotpText.t('verify') : I18n.t('登录');
  if (!active) setCsrfToken(null);
  (active ? totpCode : document.getElementById('username')).focus();
}
document.getElementById('login-totp-back').onclick = () => { if (!submit.disabled) { error.textContent = ''; totpStep(false); } };

async function init() {
  document.getElementById('http-warning').style.display = location.protocol === 'https:' ? 'none' : 'block';
  // 先套用branding(浏览器标题/登录标题/副标题),再判断是否是首次建管理员这个
  // 业务逻辑——如果是首次建管理员,标题要覆盖成"创建管理员账号",这个优先级
  // 高于branding里配置的login_title,所以要保证在applyBranding()之后执行。
  await applyBranding();
  await I18n.ready;

  const status = await Api.get('/api/auth/setup-status');
  if (status.needsSetup) {
    isSetupMode = true;
    document.getElementById('login-title-text').textContent = '创建管理员账号';
    document.getElementById('submit-btn').textContent = '创建账号';
    document.getElementById('password-hint').style.display = 'block';
  }
}

submit.addEventListener('click', async () => {
  if (submit.disabled) return;
  error.textContent = '';
  submit.disabled = true;
  try {
    if (waitingForTotp) {
      const code = totpCode.value.trim();
      if (!code || (totpCode.maxLength === 6 && !/^\d{6}$/.test(code))) { error.textContent = TotpText.t(totpCode.maxLength === 6 ? 'authenticatorCode' : 'loginCode'); return; }
      await Api.post('/api/auth/login/totp', { code });
    } else {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) { error.textContent = I18n.t('请输入用户名和密码'); return; }
      const result = await Api.post(isSetupMode ? '/api/auth/setup' : '/api/auth/login', { username, password });
      if (result.requiresTotp) {
        setCsrfToken(result.csrfToken);
        totpStep(true, result.authenticatorOnly);
        return;
      }
    }
    window.location.href = '/index.html';
  } catch (failure) {
    if (waitingForTotp && failure.details?.code === 'totp_login_expired') totpStep(false);
    if (waitingForTotp) { totpCode.value = ''; totpCode.focus(); }
    error.textContent = TotpText.failure(failure);
  } finally { submit.disabled = false; }
});

for (const id of ['username', 'password', 'login-totp-code']) {
  document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') submit.click(); });
}

init();
</script>
</body>
</html>
